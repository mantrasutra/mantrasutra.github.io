<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mantra</title>

<link rel="stylesheet" href="css/site.css"><link rel="icon" href="favicon.ico" sizes="48x48"><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="site.webmanifest"><meta name="theme-color" content="#fbfaf7" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#17161a" media="(prefers-color-scheme: dark)">
<style>
  :root { --bg:#f6f3ec; --fg:#1d1b18; --muted:#6b655c; --line:#d8d1c4; --accent:#a63a21; --panel:#fffdf8; --l:#2f6f8f; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#16140f; --fg:#ece6da; --muted:#a39b8d; --line:#36312a; --accent:#e07a5f; --panel:#1f1c16; --l:#7fb3d0; } }
  :root[data-theme="dark"] { --bg:#16140f; --fg:#ece6da; --muted:#a39b8d; --line:#36312a; --accent:#e07a5f; --panel:#1f1c16; --l:#7fb3d0; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui,"Noto Sans Devanagari",sans-serif; }
  main { max-width:1100px; margin:0 auto; padding:12px 16px; }
  #app { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 12px; overflow-x:auto; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:14px 0 6px; }
  textarea { width:100%; font:18px/1.6 inherit; color:var(--fg); background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:8px; margin-top:8px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:6px; }
  .pada { display:flex; flex-wrap:wrap; gap:2px; margin:6px 0; align-items:flex-end; }
  .sy { display:inline-flex; flex-direction:column; align-items:center; min-width:2em; padding:2px 3px; border-radius:4px; border:1px solid var(--line); }
  .sy b { font-size:12px; } .sy small { font-size:10px; color:var(--muted); max-width:9em; text-align:center; }
  .sy.G b { color:var(--accent); } .sy.L b { color:var(--l); } .sy.dev { outline:2px dashed var(--accent); }
  .meta,.note { color:var(--muted); font-size:13px; } .metre { font-size:20px; }
  .refusal { color:var(--accent); border:1px solid var(--accent); border-radius:6px; padding:8px; }
  svg { width:100%; max-height:120px; color:var(--accent); border:1px solid var(--line); border-radius:6px; }
</style>
</head>
<body data-page="mantra"><div id="site-header"></div>
<main id="main"><h1>Mantra</h1><div id="app"></div></main>
<script type="module">
  import { mountMantra } from './js/mantra.mjs';
  window.__mantra = mountMantra(document.getElementById('app'));
</script>
<div id="site-footer"></div>
<script type="module" src="js/nav.mjs"></script>
</body>
</html>
