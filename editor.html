<!doctype html>

<html lang="sa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>सूत्र — editor</title>

<link rel="stylesheet" href="./vendor/katex/katex.min.css">
<link rel="stylesheet" href="css/site.css">
<style>
  :root { --bg:#f6f3ec; --fg:#1d1b18; --muted:#6b655c; --line:#d8d1c4; --accent:#a63a21; --panel:#fffdf8; --bad:#9b1c1c; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#16140f; --fg:#ece6da; --muted:#a39b8d; --line:#36312a; --accent:#e07a5f; --panel:#1f1c16; --bad:#f08a8a; } }
  :root[data-theme="dark"] { --bg:#16140f; --fg:#ece6da; --muted:#a39b8d; --line:#36312a; --accent:#e07a5f; --panel:#1f1c16; --bad:#f08a8a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui,"Noto Sans Devanagari",sans-serif; }
  #app { max-width:1100px; margin:0 auto; padding:12px 16px; display:grid; gap:12px; grid-template-columns:1fr 1fr; }
  @media (max-width:860px) { #app { grid-template-columns:1fr; } }
  section { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 12px; min-width:0; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:0 0 6px; }
  textarea, select { width:100%; font:inherit; font-size:17px; color:var(--fg); background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:6px 8px; }
  select { width:auto; font-size:15px; }
  math-field { width:100%; font-size:22px; border:1px solid var(--line); border-radius:6px; padding:6px; background:var(--bg); color:var(--fg); margin-bottom:6px; }
  button { font:inherit; padding:4px 10px; border:1px solid var(--line); border-radius:5px; background:var(--bg); color:var(--fg); cursor:pointer; }
  pre.out { white-space:pre-wrap; overflow-wrap:anywhere; margin:0; font:15px/1.4 system-ui,"Noto Sans Devanagari",sans-serif; }
  .rendered { font-size:22px; overflow-x:auto; min-height:2em; }
  .refusal { color:var(--bad); font-weight:600; overflow-wrap:anywhere; }
  .note { color:var(--muted); font-size:13px; }
</style>
</head>
<body data-page="editor"><div id="site-header"></div>
<main id="main"><h1>Editor</h1><p class="note" id="status">The engine loads on first use (about 25 MB, once).</p>
<div id="app"></div></main>
<script type="module">
  import { mountEditor } from './js/editor.mjs';
  const ed = mountEditor(document.getElementById('app'), { onChange: (r) => { document.getElementById('status').textContent = r.ok === false ? 'refused' : 'parsed'; } });
  ed.setText('x^2/(1+e^x)', 'plain');
  window.__editor = ed;
</script>
<div id="site-footer"></div>
<script type="module" src="js/nav.mjs"></script>
</body>
</html>
